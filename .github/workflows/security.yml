name: DevSecOps Pipeline & Security Automation

on:
  push:
    branches:
      - main
      - master
      - dev
      - member1-kadiman
      - member3-Amasha
      - member4-Dewminie

  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  secops-pipeline:
    name: DevSecOps Security Pipeline
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. GATE 1 - SAST
      # Static Application Security Testing
      # Tool: Semgrep
      # ============================================================

      - name: Gate 1 - Run SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        continue-on-error: false
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}


      # ============================================================
      # 3. GATE 2 - DEPENDENCY SCAN
      # Tool: npm audit
      #
      # Juice Shop does not have a usable package-lock.json
      # for npm ci in this pipeline, therefore npm install is used.
      # ============================================================

      - name: Gate 2 - Run Dependency Scan (npm audit)
        working-directory: application/juice-shop
        run: |
          echo "=========================================="
          echo "Gate 2 - Dependency Security Scan"
          echo "=========================================="

          echo "Installing dependencies..."
          npm install --ignore-scripts

          echo ""
          echo "Running npm audit..."
          npm audit --audit-level=high || true

          echo ""
          echo "Dependency scan completed."
          echo "=========================================="


      # ============================================================
      # 4. GATE 3 - SECRET SCANNING
      # Tool: Gitleaks
      #
      # Juice Shop contains intentional training/test credentials
      # and security challenge fixtures.
      # This is the BLOCKING gate. continue-on-error is not set, so any
      # secret not allowlisted in .gitleaks.toml fails the pipeline.
      # 
      # Intentional Juice Shop training fixtures are allowlisted by path.
      # ============================================================

      - name: Gate 3 - Run Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # 5. BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker Image
        working-directory: application
        run: |
          echo "=========================================="
          echo "Building Juice Shop Docker Image"
          echo "=========================================="

          docker build \
            -t ie3142-juice-shop:latest \
            -f juice-shop/Dockerfile \
            juice-shop

          echo ""
          echo "Docker image built successfully."

          docker images ie3142-juice-shop:latest


      # ============================================================
      # 6. VERIFY DOCKER IMAGE
      # ============================================================

      - name: Verify Docker Image
        run: |
          echo "=========================================="
          echo "Verifying Docker Image"
          echo "=========================================="

          docker image inspect ie3142-juice-shop:latest

          echo ""
          echo "Docker image verification successful."


      # ============================================================
      # 7. GATE 4 - CONTAINER VULNERABILITY SCAN
      # Tool: Trivy
      #
      # scanners: vuln
      # Only vulnerability scanning is performed.
      #
      # exit-code: 0
      # Trivy reports vulnerabilities but does not fail the
      # complete pipeline because OWASP Juice Shop intentionally
      # contains vulnerable dependencies for security training.
      # ============================================================

      - name: Gate 4 - Run Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        continue-on-error: false
        with:
          image-ref: ie3142-juice-shop:latest
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          exit-code: '0'


      # ============================================================
      # 8. SECURITY PIPELINE COMPLETED
      # ============================================================

      - name: Security Pipeline Completed
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo " DevSecOps Security Pipeline Completed"
          echo "=========================================="
          echo ""
          echo "Gate 1 - SAST (Semgrep):          COMPLETED"
          echo "Gate 2 - Dependency Scan:         COMPLETED"
          echo "Gate 3 - Secret Scan (Gitleaks):  COMPLETED"
          echo "Docker Build:                      PASSED"
          echo "Docker Verification:              PASSED"
          echo "Gate 4 - Trivy Scan:               COMPLETED"
          echo ""
          echo "Security scan findings, if any,"
          echo "are available in the workflow logs."
          echo ""
          echo "=========================================="
