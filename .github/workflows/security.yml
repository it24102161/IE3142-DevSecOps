name: DevSecOps Pipeline & Security Automation

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  secops-pipeline:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Gate 1 - SAST
      # --------------------------------------------------
      - name: Gate 1 - Run SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: auto

      # --------------------------------------------------
      # 3. Gate 2 - Dependency Scan
      # --------------------------------------------------
      - name: Gate 2 - Run Dependency Scan (npm audit)
        working-directory: application/juice-shop
        continue-on-error: true
        run: |
          npm audit --audit-level=high

      # --------------------------------------------------
      # 4. Gate 3 - Secrets Scan
      # --------------------------------------------------
      - name: Gate 3 - Run Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 5. Build Docker Image
      # --------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t ie3142-juice-shop:ci \
            ./application/juice-shop

      # --------------------------------------------------
      # 6. Verify Docker Image
      # --------------------------------------------------
      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect ie3142-juice-shop:ci

      # --------------------------------------------------
      # 7. Gate 4 - Container Image Scan
      # --------------------------------------------------
      - name: Gate 4 - Run Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ie3142-juice-shop:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false
