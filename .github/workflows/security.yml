name: DevSecOps Pipeline & Security Automation

on:
  push:
    branches:
      - main
      - master
      - dev
      - member1-kadiman

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  secops-pipeline:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ============================================================
      # 2. GATE 1 - SAST
      # Static Application Security Testing using Semgrep
      # ============================================================
      - name: Gate 1 - Run SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: auto


      # ============================================================
      # 3. GATE 2 - DEPENDENCY SCAN
      # npm audit for OWASP Juice Shop
      # ============================================================
      - name: Gate 2 - Run Dependency Scan (npm audit)
        working-directory: ./application/juice-shop
        run: |
          echo "Running npm dependency security audit..."
          npm audit --audit-level=high || true


      # ============================================================
      # 4. GATE 3 - SECRETS SCAN
      # Gitleaks
      # ============================================================
      - name: Gate 3 - Run Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml


      # ============================================================
      # 5. BUILD DOCKER IMAGE
      # Build the Juice Shop Docker image from its Dockerfile
      # ============================================================
      - name: Build Docker Image
        run: |
          echo "Building OWASP Juice Shop Docker image..."

          docker build \
            -t ie3142-juice-shop:latest \
            ./application/juice-shop


      # ============================================================
      # 6. VERIFY DOCKER IMAGE
      # ============================================================
      - name: Verify Docker Image
        run: |
          echo "Verifying Docker image..."

          docker images ie3142-juice-shop:latest

          docker image inspect ie3142-juice-shop:latest


      # ============================================================
      # 7. GATE 4 - CONTAINER IMAGE SCAN
      # Trivy scans the image built by this pipeline
      # ============================================================
      - name: Gate 4 - Run Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ie3142-juice-shop:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'


      # ============================================================
      # 8. PIPELINE SUCCESS MESSAGE
      # ============================================================
      - name: Security Pipeline Completed
        if: success()
        run: |
          echo "=============================================="
          echo " DevSecOps Security Pipeline PASSED"
          echo "=============================================="
          echo "Gate 1 - Semgrep SAST       : PASSED"
          echo "Gate 2 - npm Audit          : PASSED"
          echo "Gate 3 - Gitleaks           : PASSED"
          echo "Docker Image Build          : PASSED"
          echo "Docker Image Verification   : PASSED"
          echo "Gate 4 - Trivy              : PASSED"
          echo "=============================================="
