name: DevSecOps Pipeline & Security Automation

on:
  push:
    branches:
      - main
      - master
      - dev
      - member1-kadiman

  pull_request:
    branches:
      - main
      - master

jobs:
  secops-pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate 1 - Run SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Gate 2 - Run Dependency Scan (npm audit)
        working-directory: application/juice-shop
        run: |
          npm audit --audit-level=high || true

      - name: Gate 3 - Run Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ie3142-juice-shop:ci ./application/juice-shop

      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect ie3142-juice-shop:ci

      - name: Gate 4 - Run Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ie3142-juice-shop:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false